# CHỈ DÙNG LOCAL DEV. Password 123456 tuyệt đối không đưa lên server/staging.
# Chạy:  docker compose up -d   |   Kết nối: localhost,1433  sa / 123456
services:
  sqlservice:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlservice
    environment:
      ACCEPT_EULA: "Y"
      # Password tạm để pass policy lúc khởi tạo instance, sau đó bị đổi thành 123456
      MSSQL_SA_PASSWORD: "Boot#Str0ng_2024"
      MSSQL_PID: Developer
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:1433:1433"   # bind loopback, không hở ra LAN
    volumes:
      - mssql-data:/var/opt/mssql
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        SQLPID=$$!

        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        for i in $$(seq 1 60); do
          $$SQLCMD -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -N -Q "SELECT 1" -b -o /dev/null 2>/dev/null && break
          $$SQLCMD -S localhost -U sa -P "123456"               -C -N -Q "SELECT 1" -b -o /dev/null 2>/dev/null && break
          sleep 2
        done

        $$SQLCMD -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -N -b -Q "
          ALTER LOGIN sa WITH CHECK_POLICY = OFF;
          ALTER LOGIN sa WITH PASSWORD = N'123456';
        " 2>/dev/null && echo '[init] sa password -> 123456'

        $$SQLCMD -S localhost -U sa -P "123456" -C -N -b -Q "
          IF DB_ID(N'HotelManagementDb') IS NULL
          BEGIN
            CREATE DATABASE [HotelManagementDb] COLLATE Vietnamese_CI_AS;
            ALTER DATABASE [HotelManagementDb] SET RECOVERY SIMPLE;
          END
        " && echo '[init] HotelManagementDb ready'

        wait $$SQLPID
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 123456 -C -N -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 4G }        # SQL Server cần tối thiểu ~2GB, thiếu là exit code 1
        reservations: { memory: 2G }

volumes:
  mssql-data:
